name: Weekly Competitor Intel Scrape
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
jobs:
  scrape-diff-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node (for Bright Data CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: pip install pyyaml requests
      - name: Install Bright Data CLI globally
        run: npm install -g @brightdata/cli
      - name: Authenticate Bright Data CLI
        run: bdata login --api-key "${{ secrets.BRIGHTDATA_API_KEY }}"
      - name: Run scrape pipeline
        run: python scripts/run_pipeline.py
      - name: Diff against last snapshot
        run: python scripts/diff_snapshots.py
      - name: Send alert if anything changed
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python scripts/send_alert.py
      - name: Commit new snapshots
        run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: weekly snapshot $(date -u +%F)"
          git push
